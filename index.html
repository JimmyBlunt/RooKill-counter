s="action" id="undo">↩︎ −1 Zurück</button><button class="action" id="reset">⟳ Reset heute</button></div></main><script>const $=id=>document.getElementById(id),c=$('count'),today=$('today'),best=$('best'),total=$('total'),bestTop=$('bestTop'),banner=$('banner'),snd=$('sound');function dk(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}const key='rookill-'+dk();let n=Number(localStorage.getItem(key)||0),soundOn=localStorage.getItem('rookill-sound')!=='off';function vals(){let a=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('rookill-')&&!k.includes('sound'))a.push(Number(localStorage.getItem(k)||0))}return a}function render(){localStorage.setItem(key,String(n));c.textContent=today.textContent=n;let a=vals(),b=a.length?Math.max(...a):n,t=a.reduce((x,y)=>x+y,0);best.textContent=bestTop.textContent=b;total.textContent=t;c.animate([{transform:'scale(1)'},{transform:'scale(1.16)'},{transform:'scale(1)'}],{duration:220})}function tone(freq=230,d=.2){if(!soundOn)return;let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let x=new A,o=x.createOscillator(),g=x.createGain();o.type='sine';o.frequency.setValueAtTime(freq,x.currentTime);o.frequency.exponentialRampToValueAtTime(110,x.currentTime+d);g.gain.setValueAtTime(.001,x.currentTime);g.gain.exponentialRampToValueAtTime(.28,x.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,x.currentTime+d);o.connect(g).connect(x.destination);o.start();o.stop(x.currentTime+d+.02)}function bonus(){if(![10,50,100,300].includes(n))return;banner.textContent={10:'🦘 10! Erste Dekade!',50:'🎉 50! Halb-Hundert!',100:'🏆 100! Century!',300:'🚨 300! ULTRA-KÄNGURU! 🚨'}[n];banner.classList.remove('show');void banner.offsetWidth;banner.classList.add('show');[392,523,659,784].slice(0,n>=100?4:n>=50?4:3).forEach((f,i)=>setTimeout(()=>tone(f,.16),i*90));if(navigator.vibrate)navigator.vibrate(n===300?[120,60,120,60,220]:[80,45,110])}$('plus').onclick=()=>{n++;render();tone();bonus();if(navigator.vibrate)navigator.vibrate(30)};$('undo').onclick=()=>{if(n>0){n--;render()}};$('reset').onclick=()=>{if(confirm('Heutigen Zähler wirklich auf 0 setzen?')){n=0;render()}};snd.onclick=()=>{soundOn=!soundOn;localStorage.setItem('rookill-sound',soundOn?'on':'off');snd.textContent=soundOn?'🔊':'🔇';if(soundOn)tone()};snd.textContent=soundOn?'🔊':'🔇';window.addEventListener('pagehide',()=>localStorage.setItem(key,String(n)));render();</script></body></html>
